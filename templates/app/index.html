<html lang="en" data-theme="dark" data-kiln="{{ID}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{PITCH}}">
<meta name="generator" content="KILN {{KILN_VERSION}} ({{TIER}} build)">
<meta name="kiln-fingerprint" content="{{FINGERPRINT}}">
<meta name="kiln-spec" content="{{SPEC_PATH}}">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="{{ACCENT}}">
<style>
  :root{
    --accent: {{ACCENT}};
    --bg:#0f1116; --panel:#171a21; --line:#262b36; --ink:#e7ebf3;
    --muted:#98a2b3; --danger:#ff6b6b; --ok:#4ade80;
    --r:10px; --pad:16px;
  }
  html[data-theme="light"]{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e2e5ea; --ink:#141821; --muted:#5b6472;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--bg);
    border-bottom:1px solid var(--line); padding:12px var(--pad);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  h1{font-size:17px; margin:0; letter-spacing:.2px; flex:1 1 auto; min-width:120px}
  h1 small{display:block; font-weight:400; color:var(--muted); font-size:12px}
  main{max-width:860px; margin:0 auto; padding:var(--pad)}
  button,select,input,textarea{
    font:inherit; color:inherit; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent); color:#0b0d12; border-color:transparent; font-weight:600}
  button.ghost{background:transparent}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .spacer{flex:1 1 auto}
  #search{flex:1 1 220px; min-width:160px}
  .strip{display:flex; gap:14px; margin:0 0 12px; color:var(--muted); font-size:13px}
  .strip b{color:var(--ink)}
  ul.list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
  li.item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:12px 14px; display:flex; gap:12px; align-items:flex-start;
  }
  li.item .body{flex:1 1 auto; min-width:0}
  li.item .t{font-weight:600; overflow-wrap:anywhere}
  li.item .d{color:var(--muted); font-size:13px; overflow-wrap:anywhere; white-space:pre-wrap}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
  .chip{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted)}
  .overdue{color:var(--danger); font-size:12px; font-weight:600}
  .empty{color:var(--muted); text-align:center; padding:40px 10px}
  .banner{
    margin:0 0 12px; padding:10px 12px; border-radius:8px; font-size:13px;
    border:1px solid var(--line); background:var(--panel);
  }
  .banner.warn{border-color:#7a5a1a}
  .banner.bad{border-color:var(--danger)}
  dialog{
    border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
    color:var(--ink); padding:18px; width:min(520px,92vw);
  }
  dialog::backdrop{background:rgba(0,0,0,.55)}
  label{display:block; margin:10px 0 4px; font-size:13px; color:var(--muted)}
  label input,label textarea,label select{width:100%; margin-top:4px}
  .err{color:var(--danger); font-size:12px; min-height:16px}
  .hint{color:var(--muted); font-size:11px}
  @media print{
    header button, #search, .strip, .chips, .hint{display:none !important}
    body{background:#fff; color:#000}
    li.item{border-color:#ccc; break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}<small>{{PITCH}}</small></h1>
  <div class="row">
    <button id="add" class="primary">New {{ENTITY}}</button>
    <button id="export" class="ghost" title="Export">Export</button>
    <button id="about" class="ghost" title="About this app">About</button>
    <button id="theme" class="ghost" title="Theme">Theme</button>
  </div>
</header>
<main>
  <div id="banners"></div>
  <div class="row" style="margin-bottom:10px">
    <input id="search" type="search" placeholder="Search {{ENTITY_PLURAL}}  (Ctrl-K)" autocomplete="off">
    <select id="sort" aria-label="Sort"></select>
    <select id="filter" aria-label="Filter" hidden></select>
    <button id="print" class="ghost" title="Print">Print</button>
  </div>
  <div class="strip" id="strip" hidden></div>
  <ul class="list" id="list"></ul>
</main>

<dialog id="about">
  <strong>About {{TITLE}}</strong>
  <div id="aboutBody" style="margin-top:10px;font-size:13px;line-height:1.6"></div>
  <div class="row" style="margin-top:16px">
    <div class="spacer"></div>
    <button type="button" class="primary" id="aboutClose">Close</button>
  </div>
</dialog>

<dialog id="editor">
  <form id="form" method="dialog" novalidate>
    <strong id="editorTitle">New {{ENTITY}}</strong>
    <div id="fields"></div>
    <div class="err" id="formErr"></div>
    <div class="row" style="margin-top:14px">
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <div class="spacer"></div>
      <button type="submit" class="primary">Save</button>
    </div>
    <p class="hint" style="margin:10px 0 0">Stored on this device only. Nothing leaves it.</p>
  </form>
</dialog>

<script>
"use strict";
/* Generated by KILN from {{SPEC_PATH}}. The spec is the source of truth;
   this file is a build artifact. Edit the spec and rebuild. */
const MODEL = {{MODEL_JSON}};
const BUILD = {{BUILD_JSON}};
const MODEL_CANON = {{MODEL_CANON}};
const F = new Set(MODEL.features);

/* ---------- provenance and integrity ----------
   The fingerprint is a hash of the model this file was built from. If the model
   has been edited since, the app says so rather than pretending. It is evidence,
   not enforcement: anyone can edit this file. */
function canon(v) {
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
}
function fnv(str) {
  let h = 0xcbf29ce484222325n;
  const prime = 0x100000001b3n, mask = 0xffffffffffffffffn;
  const bytes = new TextEncoder().encode(str);
  for (let i = 0; i < bytes.length; i++) {
    h ^= BigInt(bytes[i]);
    h = (h * prime) & mask;
  }
  return h.toString(16).padStart(16, "0");
}
function tampered() {
  try { return fnv(canon(MODEL)) !== BUILD.fp; } catch (e) { return true; }
}
const ENTITY = MODEL.entities[0];
const FIELDS = ENTITY.fields;
const KEY = "kiln:" + MODEL.namespace;
const THEME_KEY = "kiln:" + MODEL.namespace + ":theme";
const LANG_KEY = "kiln:" + MODEL.namespace + ":lang";

const LANGS = {
  en: {add: "New", search: "Search", empty: "Nothing here yet.", save: "Save", cancel: "Cancel", del: "Delete"},
  hi: {add: "नया", search: "खोजें", empty: "अभी कुछ नहीं है।", save: "सहेजें", cancel: "रद्द", del: "हटाएँ"}
};
let lang = "en";

let rows = [];
let query = "";
let sortBy = "created";
let sortDir = -1;
let filterVal = "";
let editingId = null;
let banner = null;

const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const uid = () => (crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- storage: quota, corruption, versioning ---------- */
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); }
  catch (e) { banner = {kind: "bad", text: "Storage is unavailable in this browser. Changes will not survive a reload."}; return []; }
  if (!raw) return [];
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.rows)) throw new Error("shape");
    return parsed.rows;
  } catch (e) {
    try { localStorage.setItem(KEY + ":corrupt:" + Date.now(), raw); } catch (e2) {}
    banner = {kind: "bad", text: "The saved state was corrupt and has been reset. The previous data was kept under " + KEY + ":corrupt."};
    return [];
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({v: MODEL.version, rows: rows}));
    return true;
  } catch (e) {
    banner = {kind: "bad", text: "Storage is full. This change is in memory only and will be lost on reload. Export now to keep it."};
    paintBanners();
    return false;
  }
}

/* ---------- rendering ---------- */
function paintBanners() {
  const box = $("#banners");
  box.innerHTML = "";
  const list = [];
  if (banner) list.push(banner);
  if (F.has("crud") && navigator.onLine === false) {
    list.push({kind: "warn", text: "You are offline. Everything here still works; nothing needs the network."});
  }
  for (const b of list) {
    const d = el("div", "banner " + (b.kind || ""), b.text);
    box.appendChild(d);
  }
}
function visible() {
  let out = rows.slice();
  if (F.has("search") && query) {
    const q = query.toLowerCase();
    out = out.filter((r) => FIELDS.some((f) => {
      const v = r[f.name];
      if (v === undefined || v === null) return false;
      return Array.isArray(v) ? v.join(" ").toLowerCase().includes(q) : String(v).toLowerCase().includes(q);
    }));
  }
  if (F.has("filters") && filterVal) {
    out = out.filter((r) => FIELDS.some((f) =>
      (f.type === "select" && String(r[f.name]) === filterVal) ||
      (f.type === "tags" && Array.isArray(r[f.name]) && r[f.name].includes(filterVal))));
  }
  if (F.has("sort") || true) {
    out.sort((a, b) => {
      const x = a[sortBy], y = b[sortBy];
      if (x === y) return 0;
      if (x === undefined || x === null) return 1;
      if (y === undefined || y === null) return -1;
      return (x > y ? 1 : -1) * sortDir;
    });
  }
  return out;
}
function isOverdue(r) {
  if (!F.has("reminder")) return false;
  const due = r.due;
  if (!due) return false;
  if (r.done === true) return false;
  return String(due) < today();
}
function render() {
  paintBanners();
  const list = $("#list");
  const items = visible();
  list.innerHTML = "";
  if (!items.length) {
    list.appendChild(el("li", "empty", rows.length ? "No match." : LANGS[lang].empty));
  }
  for (const r of items) {
    const li = el("li", "item");
    const body = el("div", "body");
    const title = el("div", "t");
    title.innerHTML = esc(r[FIELDS[0].name] || "(untitled)");
    body.appendChild(title);
    for (const f of FIELDS.slice(1)) {
      if (f.type === "bool") continue;
      const v = r[f.name];
      if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) continue;
      if (f.type === "tags" && Array.isArray(v)) {
        const chips = el("div", "chips");
        v.forEach((t) => chips.appendChild(el("span", "chip", t)));
        body.appendChild(chips);
      } else {
        body.appendChild(el("div", "d", (f.label + ": " + v)));
      }
    }
    if (isOverdue(r)) body.appendChild(el("div", "overdue", "Overdue since " + r.due));
    li.appendChild(body);
    const acts = el("div", "row");
    const edit = el("button", "ghost", "Edit");
    edit.onclick = () => openEditor(r.id);
    const del = el("button", "ghost", LANGS[lang].del);
    del.onclick = () => {
      if (!confirm("Delete this " + ENTITY.label.toLowerCase() + "?")) return;
      rows = rows.filter((x) => x.id !== r.id);
      save(); render();
    };
    acts.appendChild(edit); acts.appendChild(del);
    li.appendChild(acts);
    list.appendChild(li);
  }
  const strip = $("#strip");
  if (F.has("stats")) {
    strip.hidden = false;
    const over = rows.filter(isOverdue).length;
    strip.innerHTML = "<span><b>" + rows.length + "</b> total</span>" +
      "<span><b>" + items.length + "</b> shown</span>" +
      (F.has("reminder") ? "<span><b>" + over + "</b> overdue</span>" : "");
  } else {
    strip.hidden = true;
  }
}

/* ---------- form ---------- */
function fieldInput(f, value) {
  let input;
  if (f.type === "longtext") {
    input = document.createElement("textarea");
    input.rows = 4;
  } else if (f.type === "select") {
    input = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "-";
    input.appendChild(blank);
    for (const o of (f.options || [])) {
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      input.appendChild(op);
    }
  } else if (f.type === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
  } else if (f.type === "number") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "any";
  } else if (f.type === "date") {
    input = document.createElement("input");
    input.type = "date";
  } else if (f.type === "tags") {
    input = document.createElement("input");
    input.type = "text";
    input.placeholder = "comma, separated";
  } else {
    input = document.createElement("input");
    input.type = "text";
  }
  input.id = "f_" + f.name;
  input.name = f.name;
  if (f.type === "bool") input.checked = value === true || value === "true";
  else if (f.type === "tags") input.value = Array.isArray(value) ? value.join(", ") : (value || "");
  else input.value = value === undefined || value === null ? (f.default !== undefined ? f.default : "") : value;
  return input;
}
function openEditor(id) {
  editingId = id || null;
  const r = id ? rows.find((x) => x.id === id) : null;
  $("#editorTitle").textContent = (r ? "Edit " : "New ") + ENTITY.label;
  const box = $("#fields");
  box.innerHTML = "";
  $("#formErr").textContent = "";
  for (const f of FIELDS) {
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.required ? " *" : "");
    lab.appendChild(fieldInput(f, r ? r[f.name] : undefined));
    box.appendChild(lab);
  }
  $("#editor").showModal();
  const first = box.querySelector("input,textarea,select");
  if (first) first.focus();
}
function readForm() {
  const out = {}, errs = [];
  for (const f of FIELDS) {
    const input = $("#f_" + f.name);
    let v;
    if (f.type === "bool") v = input.checked;
    else if (f.type === "tags") v = input.value.split(",").map((s) => s.trim()).filter(Boolean);
    else if (f.type === "number") {
      if (input.value === "") v = null;
      else if (isNaN(Number(input.value))) errs.push(f.label + " must be a number");
      else v = Number(input.value);
    } else v = input.value.trim();
    if (f.required && (v === "" || v === null || v === undefined)) errs.push(f.label + " is required");
    if (f.type === "date" && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errs.push(f.label + " must be a date");
    if (f.type === "select" && v && !(f.options || []).includes(v)) errs.push(f.label + " must be one of the listed values");
    out[f.name] = v;
  }
  return {out, errs};
}

/* ---------- export / import ---------- */
function download(name, text, mime) {
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toCSV() {
  const cols = FIELDS.map((f) => f.name);
  const cell = (v) => {
    const s = Array.isArray(v) ? v.join("; ") : (v === undefined || v === null ? "" : String(v));
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(",")].concat(rows.map((r) => cols.map((c) => cell(r[c])).join(","))).join("\n");
}
function doExport() {
  const stamp = today();
  if (F.has("export")) {
    download(MODEL.id + "-" + stamp + ".json", JSON.stringify({v: MODEL.version, rows: rows}, null, 2), "application/json");
    download(MODEL.id + "-" + stamp + ".csv", toCSV(), "text/csv");
  } else {
    download(MODEL.id + "-" + stamp + ".json", JSON.stringify({v: MODEL.version, rows: rows}, null, 2), "application/json");
  }
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(String(fr.result));
      const incoming = Array.isArray(parsed) ? parsed : parsed.rows;
      if (!Array.isArray(incoming)) throw new Error("no rows");
      const clean = incoming.filter((r) => r && typeof r === "object").map((r) => {
        const copy = Object.assign({}, r);
        if (!copy.id) copy.id = uid();
        return copy;
      });
      rows = clean;
      save(); render();
    } catch (e) {
      banner = {kind: "bad", text: "That file is not a valid backup: " + e.message};
      paintBanners();
    }
  };
  fr.readAsText(file);
}

/* ---------- about: what the licence put in this file ---------- */
function aboutHtml() {
  const sp = BUILD.sponsor || {};
  const link = (href, text) => '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(text) + "</a>";
  if (BUILD.tier === "commercial") {
    /* one line, and nothing else */
    return "<p>Built with " + link(BUILD.site, "KILN") + ".</p>";
  }
  const parts = [];
  parts.push("<p>Generated by <strong>KILN</strong> " + esc(BUILD.version) +
             " from <code>" + esc(BUILD.spec) + "</code>.</p>");
  parts.push("<p>Fingerprint <code>" + esc(BUILD.fp) + "</code></p>");
  parts.push("<p><strong>Licence.</strong> " + esc(BUILD.licence) +
             ". This app is yours to use and modify. The compiler is " +
             link(BUILD.licence_url, "PolyForm Noncommercial 1.0.0") +
             "; commercial use of the compiler needs a written licence.</p>");
  if (sp.upi || sp.sponsors || sp.kofi) {
    parts.push("<p><strong>If this saved you time</strong></p><ul style=\"margin:6px 0 0;padding-left:18px\">" +
      (sp.upi ? "<li>UPI: <code>" + esc(sp.upi) + "</code></li>" : "") +
      (sp.sponsors ? "<li>" + link(sp.sponsors, "GitHub Sponsors") + "</li>" : "") +
      (sp.kofi ? "<li>" + link(sp.kofi, "Ko-fi") + "</li>" : "") +
      (sp.books ? "<li>" + link(sp.books, "My books") + "</li>" : "") +
      "</ul>");
  }
  if (BUILD.tier === "demo") {
    parts.push("<p><strong>Demo build.</strong> Features are capped and export is " +
               "disabled in the online demo. Build the full app with KILN locally.</p>");
  }
  return parts.join("");
}
function bootAbout() {
  const btn = $("#about");
  btn.onclick = () => { $("#aboutBody").innerHTML = aboutHtml(); $("#about").showModal(); };
  $("#aboutClose").onclick = () => $("#about").close();
}

/* ---------- boot ---------- */
function bootTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
}
function bootPWA() {
  if (!F.has("pwa")) return;
  const manifest = {
    name: MODEL.name, short_name: MODEL.name.slice(0, 12),
    start_url: ".", display: "standalone",
    background_color: "#0f1116", theme_color: MODEL.accent,
    icons: []
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
}
function bootSort() {
  const sel = $("#sort");
  sel.innerHTML = "";
  for (const f of FIELDS) {
    const o = document.createElement("option");
    o.value = f.name; o.textContent = "Sort: " + f.label;
    sel.appendChild(o);
  }
  sel.value = FIELDS[0].name;
  sortBy = FIELDS[0].name;
  sel.onchange = () => { sortBy = sel.value; sortDir = -1; render(); };

  const filterFields = FIELDS.filter((f) => f.type === "select" || f.type === "tags");
  const fsel = $("#filter");
  fsel.innerHTML = "";
  if (F.has("filters") && filterFields.length) {
    fsel.hidden = false;
    const all = document.createElement("option");
    all.value = ""; all.textContent = "All";
    fsel.appendChild(all);
    const seen = new Set();
    for (const f of filterFields) {
      const vals = f.type === "select"
        ? (f.options || [])
        : rows.flatMap((r) => Array.isArray(r[f.name]) ? r[f.name] : []);
      for (const v of vals) {
        if (seen.has(v)) continue;
        seen.add(v);
        const o = document.createElement("option");
        o.value = v; o.textContent = v;
        fsel.appendChild(o);
      }
    }
    fsel.onchange = () => { filterVal = fsel.value; render(); };
  }
}
function boot() {
  bootTheme();
  bootPWA();
  bootAbout();
  if (tampered()) {
    banner = {kind: "bad", text: "This file was modified after it was built. " +
      "The licence and attribution shown under About describe the build, not this copy."};
  }
  if (BUILD.tier === "demo") {
    banner = {kind: "warn", text: "Demo build. Features are capped and export is disabled. " +
      "Build the full app with KILN locally — it takes one command and needs no network."};
  }
  rows = load();
  if (!rows.length && F.has("crud")) {
    /* no seeding: an empty app is a correct app */
  }
  /* a feature that is not in the model must not leave a button behind */
  if (!F.has("crud")) { $("#add").hidden = true; $("#list").hidden = true; }
  if (!F.has("export")) { $("#export").hidden = true; }
  if (!F.has("print")) { $("#print").hidden = true; }
  if (!F.has("sort")) { $("#sort").hidden = true; }
  $("#add").onclick = () => openEditor(null);
  $("#export").onclick = doExport;
  $("#theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  };
  $("#print").onclick = () => window.print();
  const s = $("#search");
  if (!F.has("search")) s.hidden = true;
  s.oninput = () => { query = s.value; render(); };
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); s.focus(); }
    if (e.key === "Escape" && $("#editor").open) $("#editor").close();
  });
  $("#cancel").onclick = () => $("#editor").close();
  $("#form").onsubmit = (e) => {
    e.preventDefault();
    const {out, errs} = readForm();
    if (errs.length) { $("#formErr").textContent = errs.join(" · "); return; }
    if (editingId) {
      const i = rows.findIndex((x) => x.id === editingId);
      if (i >= 0) rows[i] = Object.assign({}, rows[i], out, {updated: today()});
    } else {
      rows.unshift(Object.assign({id: uid(), created: today(), updated: today()}, out));
    }
    save();
    $("#editor").close();
    bootSort();
    render();
  };
  if (F.has("i18n")) {
    const sw = document.createElement("button");
    sw.className = "ghost";
    sw.textContent = "EN/हिं";
    sw.onclick = () => {
      lang = lang === "en" ? "hi" : "en";
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      $("#add").textContent = LANGS[lang].add + " " + ENTITY.label;
      s.placeholder = LANGS[lang].search + " (" + "Ctrl-K" + ")";
      render();
    };
    document.querySelector("header .row").appendChild(sw);
  }
  const imp = document.createElement("input");
  imp.type = "file"; imp.accept = ".json,application/json"; imp.hidden = true;
  imp.onchange = () => { if (imp.files && imp.files[0]) doImport(imp.files[0]); };
  document.body.appendChild(imp);
  if (F.has("import")) {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = "Import";
    b.onclick = () => imp.click();
    document.querySelector("header .row").appendChild(b);
  }
  window.addEventListener("online", render);
  window.addEventListener("offline", render);
  bootSort();
  render();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
