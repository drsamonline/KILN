<html lang="en" data-theme="dark" data-kiln="{{ID}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{PITCH}}">
<meta name="generator" content="KILN {{KILN_VERSION}} ({{TIER}} build)">
<meta name="kiln-fingerprint" content="{{FINGERPRINT}}">
<meta name="kiln-spec" content="{{SPEC_PATH}}">

<style>
  :root{
    --accent: {{ACCENT}};
    --bg:#0f1116; --panel:#171a21; --line:#262b36; --ink:#e7ebf3;
    --muted:#98a2b3; --danger:#ff6b6b; --ok:#4ade80;
    --r:10px; --pad:16px;
  }
  html[data-theme="light"]{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e2e5ea; --ink:#141821; --muted:#5b6472;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--bg);
    border-bottom:1px solid var(--line); padding:12px var(--pad);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  h1{font-size:17px; margin:0; letter-spacing:.2px; flex:1 1 auto; min-width:120px}
  h1 small{display:block; font-weight:400; color:var(--muted); font-size:12px}
  main{max-width:860px; margin:0 auto; padding:var(--pad)}
  button,select,input,textarea{
    font:inherit; color:inherit; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent); color:#0b0d12; border-color:transparent; font-weight:600}
  button.ghost{background:transparent}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .spacer{flex:1 1 auto}
  #search{flex:1 1 220px; min-width:160px}
  .strip{display:flex; gap:14px; margin:0 0 12px; color:var(--muted); font-size:13px}
  .strip b{color:var(--ink)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;
    margin:0 0 10px}
  .metric{min-width:0}
  .metric b{display:block;font-size:22px;font-weight:800;line-height:1.15}
  .metric span{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .metric .u{font-size:12px;color:var(--muted);margin-left:2px;text-transform:none;
    letter-spacing:0}
  /* @only derived */
  #derived{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin:0 0 14px}
  .spark{display:block;width:100%;height:64px}
  .spark .bar{fill:var(--accent);opacity:.85}
  .spark .bar.empty{opacity:.15}
  .spark .axis{stroke:var(--line);stroke-width:1}
  .spark .lbl{fill:var(--muted);font-size:9px}
  /* @end only */
  /* a bar, shared by the variance view and the tally view */
  .vbar{height:7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
    margin:7px 0 5px;overflow:hidden}
  .vfill{display:block;height:100%;background:var(--accent)}
  /* @only tally */
  .d.lead{color:var(--ok)}
  /* @end only */
  /* @only versus */
  #versus{margin:0 0 14px;overflow-x:auto}
  #versus table{border-collapse:collapse;width:100%;font-size:13px}
  #versus th,#versus td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left}
  #versus th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  #versus td.k{color:var(--muted)}
  #versus tr.same td{opacity:.55}
  #versus td.win{color:var(--ok);font-weight:700}
  /* @end only */
  /* @only crosstab */
  #cross{margin:0 0 14px;overflow-x:auto}
  #cross table{border-collapse:collapse;font-size:13px;min-width:100%}
  #cross th,#cross td{border:1px solid var(--line);padding:8px 11px;text-align:center;
    font-variant-numeric:tabular-nums}
  #cross th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);
    background:var(--panel)}
  #cross td.k{text-align:left;color:var(--ink)}
  #cross td.zero{color:var(--muted);opacity:.5}
  #cross td.tot{font-weight:700;background:var(--panel)}
  #cross tr.grand td{font-weight:700;background:var(--panel2)}
  /* @end only */
  /* @only report */
  #report{margin:0 0 14px;overflow-x:auto}
  #report table{border-collapse:collapse;width:100%;font-size:13px}
  #report th,#report td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}
  #report th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  #report td:nth-child(2),#report td:nth-child(3){text-align:right;
    font-variant-numeric:tabular-nums}
  #report tr.grand td{font-weight:700;border-top:2px solid var(--line)}
  /* @end only */
  /* @only gallery */
  #gal{display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;
    margin:0 0 14px}
  #gal.on{display:grid}
  .gcard{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;cursor:pointer}
  .gcard img{display:block;width:100%;height:150px;object-fit:cover;background:var(--panel2)}
  .gmiss{display:flex;align-items:center;justify-content:center;height:150px;
    background:var(--panel2);color:var(--muted);font-size:12px}
  .gcard figcaption{padding:9px 11px;font-size:13px}
  .gcard figcaption b{display:block;margin:0 0 2px}
  .gcard figcaption span{color:var(--muted);font-size:12px}
  /* @end only */
  /* @only quiz */
  #quiz{display:none;margin:0 0 14px}
  #quiz.on{display:block}
  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .qn{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .qcard h3{margin:6px 0 14px;font-size:18px;line-height:1.4}
  .opts{display:grid;gap:8px}
  .opt{text-align:left;padding:11px 13px;font-size:14px}
  /* @end only */
  /* @only timeline */
  #timeline{display:none}
  #timeline.on{display:block}
  .tlhead{margin:16px 0 6px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted)}
  /* @end only */
  /* @only directory */
  #dir{display:none;margin:0 0 14px}
  #dir.on{display:block}
  .hit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;margin:0 0 10px}
  .hit .t{font-weight:700;font-size:15px;margin:0 0 3px}
  .hit .s{color:var(--muted);font-size:12.5px;margin:0 0 5px}
  .hit .b{font-size:13px;line-height:1.55;margin:0;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hit mark{background:rgba(124,156,255,.28);color:inherit;border-radius:3px;padding:0 2px}
  #search.big{font-size:16px;padding:14px 16px}
  /* @end only */
  /* @only comparison */
  #cmp{display:none;margin:0 0 14px;overflow-x:auto}
  #cmp.on{display:block}
  #cmp table{border-collapse:collapse;width:100%;font-size:13px}
  #cmp th,#cmp td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;
    white-space:nowrap}
  #cmp th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);
    position:sticky;top:0;background:var(--bg)}
  #cmp td.best{color:var(--ok);font-weight:700}
  #cmp tr:hover td{background:var(--panel)}
  /* @end only */
  /* @only board */
  #board{display:none;gap:12px;overflow-x:auto;padding:0 0 8px;margin:0 0 14px}
  #board.on{display:flex}
  .col{flex:1 0 200px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:10px;min-height:120px}
  .col h4{margin:0 0 8px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);display:flex;justify-content:space-between}

  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:9px;margin:0 0 8px;font-size:13px}
  .card .t{font-weight:600;margin:0 0 4px}
  .card .m{color:var(--muted);font-size:12px}
  .card .mv{display:flex;gap:6px;margin:6px 0 0}
  .card .mv button{padding:2px 8px;min-height:0;font-size:12px}
  /* @end only */
  /* @only calendar */
  #cal{display:none;margin:0 0 14px}
  #cal.on{display:block}
  .calhead{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .calhead b{font-size:15px;min-width:140px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
    padding:0 0 4px;text-align:center}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:74px;
    padding:6px;font-size:12px;text-align:left;cursor:pointer;color:var(--ink)}
  .day.out{opacity:.4}
  .day.today{border-color:var(--accent)}
  .day .n{color:var(--muted);font-size:11px}
  .day .e{display:block;margin:3px 0 0;font-size:11.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .day .more{color:var(--muted);font-size:11px}
  /* @end only */
  /* @only convert */
  #convert{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin:0 0 14px}
  #convert .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  #convert .swap{align-self:end}
  #convert .result{margin:16px 0 0;padding:14px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line)}
  #convert .result .k{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  #convert .result .v{font-size:30px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
  #convert .result .v .u{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
  #convert .err{color:var(--danger);font-size:12.5px;min-height:18px;margin:10px 0 0}
  /* @end only */
  /* @only steps */
  .steps{display:flex;gap:6px;margin:0 0 12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .steps span{padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .steps span.on{border-color:var(--accent);color:var(--ink)}
  /* @end only */
  /* @only formula */
  #calc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin:0 0 14px}
  #calc .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  #calc .result{margin:16px 0 0;padding:14px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line)}
  #calc .result .k{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  #calc .result .v{font-size:30px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
  #calc .result .v .u{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
  #calc .err{color:var(--danger);font-size:12.5px;min-height:18px;margin:10px 0 0}
  /* @end only */
  /* @only progress */
  #progress{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;margin:0 0 14px}
  #progress .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin:0 0 8px;font-size:13px;color:var(--muted)}
  #progress .top b{color:var(--ink);font-size:15px}
  .track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
  .track > span{display:block;height:100%;background:var(--accent);width:0;
    transition:width .18s ease}
  /* @end only */
  /* @only toggle */
  li.item .tick{margin-top:2px;width:20px;height:20px;min-height:0;padding:0;
    accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
  li.item.done .t,li.item.done .d{opacity:.55;text-decoration:line-through}
  /* @end only */
  ul.list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
  li.item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:12px 14px; display:flex; gap:12px; align-items:flex-start;
  }
  li.item .body{flex:1 1 auto; min-width:0}
  li.item .t{font-weight:600; overflow-wrap:anywhere}
  li.item .d{color:var(--muted); font-size:13px; overflow-wrap:anywhere; white-space:pre-wrap}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
  .chip{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted)}
  .overdue{color:var(--danger); font-size:12px; font-weight:600}
  .empty{color:var(--muted); text-align:center; padding:40px 10px}
  .banner{
    margin:0 0 12px; padding:10px 12px; border-radius:8px; font-size:13px;
    border:1px solid var(--line); background:var(--panel);
  }
  .banner.warn{border-color:#7a5a1a}
  .banner.bad{border-color:var(--danger)}
  dialog{
    border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
    color:var(--ink); padding:18px; width:min(520px,92vw);
  }
  dialog::backdrop{background:rgba(0,0,0,.55)}
  label{display:block; margin:10px 0 4px; font-size:13px; color:var(--muted)}
  label input,label textarea,label select{width:100%; margin-top:4px}
  .err{color:var(--danger); font-size:12px; min-height:16px}
  .hint{color:var(--muted); font-size:11px}
  /* @only a11y */
  .skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#0b0d12;
    padding:10px 14px;border-radius:0 0 8px 0;font-weight:700;z-index:50}
  .skip:focus{left:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* @end only */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
  @media print{
    header button, #search, .strip, .chips, .hint{display:none !important}
    body{background:#fff; color:#000}
    li.item{border-color:#ccc; break-inside:avoid}
  }
</style>
</head>

<a class="skip" href="#list">Skip to the list</a>
<!-- @end only -->
<header>

  <!-- @end only -->
  <!-- @only progress -->
  <div id="progress" hidden></div>
  <!-- @end only -->
  <!-- @only formula -->
  <section id="calc" hidden></section>
  <!-- @end only -->
  <!-- @only convert -->
  <section id="convert" hidden></section>
  <!-- @end only -->
  <!-- @only directory -->
  <section id="dir" aria-label="directory"></section>
  <!-- @end only -->
  <!-- @only comparison -->
  <section id="cmp" aria-label="comparison"></section>
  <!-- @end only -->
  <!-- @only gallery -->
  <section id="gal" aria-label="gallery"></section>
  <!-- @end only -->
  <!-- @only quiz -->
  <section id="quiz" aria-label="quiz"></section>
  <!-- @end only -->
  <!-- @only timeline -->
  <section id="timeline" aria-label="timeline"></section>
  <!-- @end only -->
  <!-- @only board -->
  <div id="board" role="list"></div>
  <!-- @end only -->
  <!-- @only calendar -->
  <section id="cal" aria-label="calendar"></section>
  <!-- @end only -->
  <!-- @only versus -->
  <section id="versus" aria-label="comparison"></section>
  <!-- @end only -->
  <!-- @only crosstab -->
  <section id="cross" aria-label="crosstab"></section>
  <!-- @end only -->
  <!-- @only report -->
  <section id="report" aria-label="summary"></section>
  <!-- @end only -->
  <ul class="list" id="list"></ul>
</main>

<!-- @only detail -->
<dialog id="detail" aria-labelledby="detailTitle">
  <strong id="detailTitle">Record</strong>
  <div id="detailBody" style="margin-top:10px;font-size:14px;line-height:1.6"></div>
  <div class="row" style="margin-top:16px">
    <div class="spacer"></div>
    <button type="button" class="ghost" id="detailClose">Close</button>
    <button type="button" class="primary" id="detailEdit">Edit</button>
  </div>
</dialog>
<!-- @end only -->

<dialog id="about">
  <strong>About {{TITLE}}</strong>
  <div id="aboutBody" style="margin-top:10px;font-size:13px;line-height:1.6"></div>
  <div class="row" style="margin-top:16px">
    <div class="spacer"></div>
    <button type="button" class="primary" id="aboutClose">Close</button>
  </div>
</dialog>

<dialog id="editor">
  <form id="form" method="dialog" novalidate>
    <strong id="editorTitle">New {{ENTITY}}</strong>
    <div id="fields"></div>
    <div class="err" id="formErr"></div>
    <div class="row" style="margin-top:14px">
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <div class="spacer"></div>
      <button type="button" class="ghost" id="stepBack" hidden>Back</button>
      <button type="button" class="primary" id="stepNext" hidden>Next</button>
      <button type="button" class="primary" id="stepSave" hidden>Save</button>
      <button type="submit" class="primary">Save</button>
    </div>
    <p class="hint" style="margin:10px 0 0">Stored on this device only. Nothing leaves it.</p>
  </form>
</dialog>

<script>
"use strict";
/* Generated by KILN from {{SPEC_PATH}}. The spec is the source of truth;
   this file is a build artifact. Edit the spec and rebuild. */
const MODEL = {{MODEL_JSON}};
const CALC = MODEL.calculator || null;

const MODEL_CANON = {{MODEL_CANON}};
const F = new Set(MODEL.features);

/* ---------- provenance and integrity ----------
   The fingerprint is a hash of the model this file was built from. If the model
   has been edited since, the app says so rather than pretending. It is evidence,
   not enforcement: anyone can edit this file. */
function canon(v) {
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
}
function fnv(str) {
  let h = 0xcbf29ce484222325n;
  const prime = 0x100000001b3n, mask = 0xffffffffffffffffn;
  const bytes = new TextEncoder().encode(str);
  for (let i = 0; i < bytes.length; i++) {

  return h.toString(16).padStart(16, "0");

}
const MULTI = MODEL.entities.length > 1 && F.has("multi");
let ENTITY = MODEL.entities[0] || {name: "item", label: "Item", fields: []};
let FIELDS = ENTITY.fields || [];
const DB = {};                       /* entity name -> rows */
for (const e of MODEL.entities) DB[e.name] = [];
/* @only multi */
function setEntity(name) {
  const e = MODEL.entities.find((x) => x.name === name);
  if (!e) return;
  ENTITY = e;
  FIELDS = e.fields || [];
  rows = DB[name] || [];
  bootSort();
  render();
}
/* @end only */

const KEY = "kiln:" + MODEL.namespace;
const THEME_KEY = "kiln:" + MODEL.namespace + ":theme";
const LANG_KEY = "kiln:" + MODEL.namespace + ":lang";

/* the interface in each language. Data is never translated (§1).
   EN is always emitted, so an app with no i18n still has readable labels. */
/* only the labels the runtime actually translates */
const EN = {add: "New", search: "Search", empty: "Nothing here yet.", del: "Delete",
            edit: "Edit", sortBy: "Sort: ", all: "All", total: "total", shown: "shown"

/* @only i18n */
const LANGS = {
  en: EN,

/* ---------- a running balance ----------
   Pure: rows, an amount field and a date field; each row with the balance after it. run:start */
function runningTotal(rows, field, dateField) {
  const out = rows.slice();
  out.sort((a, b) => {
    const x = String(a[dateField] || "");
    const y = String(b[dateField] || "");
    if (x !== y) return x < y ? -1 : 1;
    return String(a.id) < String(b.id) ? -1 : 1;
  });
  let balance = 0;
  const marks = {};
  for (const r of out) {
    const v = Number(r[field]);
    balance += isFinite(v) ? v : 0;
    marks[r.id] = balance;
  }
  return {order: out, marks: marks, closing: balance};
}
/* run:end */

/* ---------- apportion one amount by weight ----------
   Pure: rows, a weight field and a total in cents; a share per row that adds up.
   Largest remainder, so rounding can never lose or invent a unit. split:start */
function splitOf(rows, weightField, total) {
  const T = Math.round(Number(total) || 0);
  const weights = rows.map((r) => {
    const w = Number(r[weightField]);
    return isFinite(w) && w > 0 ? w : 0;
  });
  const sumW = weights.reduce((a, b) => a + b, 0);
  if (sumW === 0) {
    return rows.map((r) => ({id: r.id, share: 0, pct: 0, weight: 0}));
  }
  const exact = weights.map((w) => (T * w) / sumW);
  const floors = exact.map((v) => Math.floor(v));
  let left = T - floors.reduce((a, b) => a + b, 0);
  const order = exact.map((v, i) => ({i: i, frac: v - Math.floor(v)}))
    .sort((a, b) => (b.frac - a.frac) || (a.i - b.i));
  for (let k = 0; k < order.length && left > 0; k++) {
    floors[order[k].i] += 1;
    left -= 1;
  }
  return rows.map((r, i) => ({
    id: r.id,
    share: floors[i],
    pct: Math.round((weights[i] / sumW) * 100),
    weight: weights[i]
  }));
}
/* split:end */

/* ---------- two records, field by field ----------
   Pure: two records and the fields to compare; one line per field. versus:start */
function comparePair(a, b, fields, directions) {
  const dir = directions || {};
  return fields.map((f) => {
    const av = a ? a[f] : undefined;
    const bv = b ? b[f] : undefined;
    const same = String(av === undefined ? "" : av) === String(bv === undefined ? "" : bv);
    let better = null;
    /* nothing is marked unless the spec says which way is better */
    if (!same && dir[f]) {
      const na = Number(av), nb = Number(bv);
      if (isFinite(na) && isFinite(nb) && na !== nb) {
        better = dir[f] === "lower" ? (na < nb ? "a" : "b") : (na > nb ? "a" : "b");
      }
    }
    return {field: f, a: av, b: bv, same: same, better: better};
  });
}
/* versus:end */

/* ---------- one computation per render ----------
   The derived figures below (a split, a running balance, a tally, a sequence, a
   parent balance) each read every row. Computing them inside the row loop makes
   the page quadratic: 1000 rows took 1198 ms. They are computed once per render
   and reused, which is why this cache exists. cache:start */
let RENDER_CACHE = {};
function cached(key, make) {
  if (!(key in RENDER_CACHE)) RENDER_CACHE[key] = make();
  return RENDER_CACHE[key];
}
/* cache:end */

const SIZE_WARN = 2000;
const BACKUP_DAYS = 7;
function lastExport() {
  try { return Number(localStorage.getItem(KEY + ":lastExport")) || 0; } catch (e) { return 0; }
}
function markExport() {
  try { localStorage.setItem(KEY + ":lastExport", String(Date.now())); } catch (e) {}
}
function feedbackBanners() {
  const out = [];
  if (rows.length > SIZE_WARN) {
    out.push({kind: "warn", text: "This app holds " + rows.length +
      " rows. Search is a linear scan, so it will start to feel slow past a few thousand. " +
      "Export and start a new file if that happens."});
  }
  const last = lastExport();
  const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
  if (rows.length > 0 && (last === 0 || days >= BACKUP_DAYS)) {
    out.push({kind: "", text: last === 0
      ? "You have not exported this list yet. Export writes a file you keep; nothing else backs it up."
      : "Last export was " + days + " days ago. Export writes a file you keep; nothing else backs it up."});
  }
  return out;
}

function visible() {
  let out = rows.slice();
  if (F.has("search") && query) {
    const q = query.toLowerCase();
    out = out.filter((r) => FIELDS.some((f) => {
      const v = r[f.name];
      if (v === undefined || v === null) return false;
      return Array.isArray(v) ? v.join(" ").toLowerCase().includes(q) : String(v).toLowerCase().includes(q);
    }));
  }
  if (F.has("filters") && filterVal) {
    out = out.filter((r) => FIELDS.some((f) =>
      (f.type === "select" && String(r[f.name]) === filterVal) ||
      (f.type === "tags" && Array.isArray(r[f.name]) && r[f.name].includes(filterVal))));
  }
  if (F.has("sort") || true) {
    out.sort((a, b) => {
      const x = a[sortBy], y = b[sortBy];
      if (x === y) return 0;
      if (x === undefined || x === null) return 1;
      if (y === undefined || y === null) return -1;
      return (x > y ? 1 : -1) * sortDir;
    });
  }
  return out;
}
function isOverdue(r) {
  if (!F.has("reminder")) return false;
  const due = r.due;
  if (!due) return false;
  if (r.done === true) return false;
  return String(due) < today();
}
/* @only chart */
function sparkSvg(spark, best) {
  const n = spark.length || 1;
  const w = 300, h = 64, pad = 2;
  const max = Math.max(best, 1);
  const bw = (w - pad * 2) / n;
  const parts = ['<svg class="spark" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="none" role="img" aria-label="Last ' + n + ' days">'];
  parts.push('<line class="axis" x1="0" y1="' + (h - 1) + '" x2="' + w + '" y2="' + (h - 1) + '"/>');
  for (let i = 0; i < n; i++) {
    const v = spark[i].v;
    const bh = Math.max(v > 0 ? 2 : 1, (v / max) * (h - 6));
    const x = pad + i * bw;
    parts.push('<rect class="bar' + (v > 0 ? "" : " empty") + '" x="' + x.toFixed(1) +
      '" y="' + (h - 1 - bh).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) +
      '" height="' + bh.toFixed(1) + '" rx="1.5"><title>' + spark[i].day + ": " + v + "</title></rect>");
  }
  parts.push("</svg>");
  return parts.join("");
}

/* @only formula */
function renderCalc() {
  const box = $("#calc");
  if (!CALC) return;
  box.hidden = false;
  const inputs = CALC.inputs || [];
  let html = '<div class="grid2">';
  for (const inp of inputs) {
    html += '<label class="f" style="margin:0">' + esc(inp.label || inp.name) +
      (inp.required ? " *" : "") +
      '<input id="ci_' + esc(inp.name) + '" type="number" step="' + esc(inp.step || "any") +
      '" inputmode="decimal" value="' + esc(inp.default === undefined ? "" : inp.default) +
      '"' + (inp.min !== undefined ? ' min="' + esc(inp.min) + '"' : "") +
      (inp.max !== undefined ? ' max="' + esc(inp.max) + '"' : "") + "></label>";
  }
  html += "</div>";
  html += '<div class="result"><div class="k">' + esc(CALC.output.label || "Result") +
    '</div><div class="v" id="calcOut">—</div></div>';
  html += '<div class="err" id="calcErr"></div>';
  if (CALC.note) html += '<p class="hint" style="margin:12px 0 0">' + esc(CALC.note) + "</p>";
  box.innerHTML = html;
  const update = () => {
    const vars = {};
    let bad = null;
    for (const inp of inputs) {
      const elx = $("#ci_" + inp.name);
      const raw = elx.value.trim();
      if (raw === "") {
        if (inp.required) bad = (inp.label || inp.name) + " is required";
        vars[inp.name] = inp.default === undefined ? 0 : Number(inp.default);
        continue;
      }
      const n = Number(raw);
      if (!isFinite(n)) { bad = (inp.label || inp.name) + " must be a number"; vars[inp.name] = 0; continue; }
      if (inp.min !== undefined && n < Number(inp.min)) bad = (inp.label || inp.name) + " is below " + inp.min;
      if (inp.max !== undefined && n > Number(inp.max)) bad = (inp.label || inp.name) + " is above " + inp.max;
      vars[inp.name] = n;
    }
    const outEl = $("#calcOut"), errEl = $("#calcErr");
    if (bad) { outEl.textContent = "—"; errEl.textContent = bad; return; }
    try {
      const v = evalFormula(CALC.formula, vars);
      const dp = Number(CALC.output.decimals);
      const shown = isFinite(dp) ? v.toFixed(Math.max(0, Math.min(6, dp))) : String(v);
      outEl.innerHTML = esc(shown) + (CALC.output.unit
        ? '<span class="u">' + esc(CALC.output.unit) + "</span>" : "");
      errEl.textContent = "";
    } catch (e) {
      outEl.textContent = "—";
      errEl.textContent = e.message;
    }
  };
  for (const inp of inputs) $("#ci_" + inp.name).oninput = update;
  update();
}

let view = "board";
function moveCard(r, delta) {
  const field = MODEL.board.field;
  const opts = (FIELDS.find((f) => f.name === field) || {}).options || [];
  const i = opts.indexOf(r[field]);
  const j = Math.min(opts.length - 1, Math.max(0, (i < 0 ? 0 : i) + delta));
  if (j === i) return;
  r[field] = opts[j];
  r.updated = today();
  save();
  render();

/* one place builds the strip, so a total and a count cannot overwrite each other */
function renderStrip() {
  const strip = $("#strip");
  const items = visible();
  const bits = [];
  /* @only sequence */
  if (MODEL.sequence) {
    let total = 0;
    for (const r of rows) total += Number(r[MODEL.sequence.duration]) || 0;
    bits.push("<span><b>" + esc(fmtDuration(total)) + "</b> total</span>");
    bits.push("<span><b>" + rows.length + "</b> items</span>");
  }
  /* @end only */

  /* @only split */
  if (MODEL.split) {
    const parts = cached("split",
      () => splitOf(rows, MODEL.split.weight, MODEL.split.total));
    let given = 0;
    for (const p of parts) given += p.share;
    bits.push("<span><b>" + esc(money(given)) + "</b> of " + esc(money(MODEL.split.total)) + "</span>");
    bits.push("<span><b>" + parts.length + "</b> shares</span>");
  }
  /* @end only */
  /* @only compute */
  if (MODEL.compute) {
    let total = 0, bad = 0;
    for (const r of rows) {
      const vars = {};
      for (const name of MODEL.compute.inputs || []) vars[name] = Number(r[name]) || 0;
      try {
        const v = evalFormula(MODEL.compute.formula, vars);
        if (isFinite(v)) total += v; else bad += 1;
      } catch (e) { bad += 1; }
    }
    bits.push("<span><b>" + esc(String(Math.round(total * 1000) / 1000)) + "</b> total</span>");
    if (bad) bits.push('<span class="bad"><b>' + bad + "</b> bad rows</span>");
  }
  /* @end only */
  /* @only running */
  if (MODEL.running) {
    const rt = cached("running",
      () => runningTotal(rows, MODEL.running.field, MODEL.running.date));
    bits.push("<span><b>" + esc(money(rt.closing)) + "</b> closing</span>");
    bits.push("<span><b>" + rows.length + "</b> entries</span>");
  }
  /* @end only */

  /* @only tally */
  if (MODEL.tally) {
    const t2 = cached("tally", () => tallyOf(rows, MODEL.tally.field));
    bits.push("<span><b>" + t2.total + "</b> votes</span>");
    const leaders = t2.shares.filter((s) => s.leading);
    if (leaders.length === 1) {
      const who = rows.find((r) => r.id === leaders[0].id);
      bits.push("<span><b>" + esc(String(who ? who[FIELDS[0].name] : "")) + "</b> leading</span>");
    } else if (leaders.length > 1) {
      bits.push("<span><b>" + leaders.length + "</b> tied</span>");
    }
  }
  /* @end only */
  /* @only decide */
  if (MODEL.decide) {
    let open = 0;
    for (const r of rows) if (!r[MODEL.decide.choice]) open += 1;
    bits.push("<span><b>" + (rows.length - open) + "</b> decided</span>");
    if (open) bits.push('<span class="bad"><b>' + open + "</b> open</span>");
  }
  /* @end only */
  /* @only recur */
  if (MODEL.recur) {
    let due = 0, soon = 0;
    const now = today();
    const inWeek = addDays(now, 7);
    for (const r of rows) {
      const nd = nextDue(r[MODEL.recur.last], r[MODEL.recur.every]);
      if (!nd) continue;
      if (nd <= now) due += 1;
      else if (nd <= inWeek) soon += 1;
    }
    if (due) bits.push('<span class="bad"><b>' + due + "</b> due</span>");
    if (soon) bits.push("<span><b>" + soon + "</b> due this week</span>");
    if (!due && !soon) bits.push("<span><b>nothing</b> due this week</span>");
  }
  /* @end only */

  if (F.has("balance") && MODEL.balance) {
    const b = MODEL.balance;
    const kids = DB[b.child] || [];
    let low = 0;
    for (const r of DB[b.master] || []) {
      const bal = balanceOf(kids.filter((k) => k[b.lookup] === r.id), b.field, r.id);
      if (b.reorder && bal <= Number(r[b.reorder] || 0)) low += 1;
    }
    if (low) bits.push('<span class="bad"><b>' + low + "</b> to reorder</span>");
  }
  /* @only variance */
  if (MODEL.variance) {
    let planned = 0, actual = 0, over = 0;
    for (const r of rows) {
      const v = varianceOf(r[MODEL.variance.planned], r[MODEL.variance.actual]);
      planned += v.planned;
      actual += v.actual;
      if (v.over) over += 1;
    }
    bits.push("<span><b>" + esc(money(planned - actual)) + "</b> left</span>");
    bits.push("<span><b>" + esc(money(actual)) + "</b> of " + esc(money(planned)) + "</span>");
    if (over) bits.push('<span class="bad"><b>' + over + "</b> over</span>");
  }
  /* @end only */
  /* @only amount */
  if (MODEL.amount) {
    let total = 0;
    for (const r of rows) total += amountOf(r[MODEL.amount.qty], r[MODEL.amount.rate]);
    bits.push("<span><b>" + esc(money(total)) + "</b> total</span>");
    bits.push("<span><b>" + rows.length + "</b> lines</span>");
  }
  /* @end only */
  if (F.has("totals") && MODEL.totals) {
    const tt = totalsOf(rows, MODEL.totals);
    const shown = MODEL.totals.format === "duration" ? fmtDuration(tt.sum) : String(tt.sum);
    bits.push("<span><b>" + esc(shown) + "</b> " + esc(MODEL.totals.label || "total") + "</span>");
  }
  if (F.has("stats")) {
    bits.push("<span><b>" + rows.length + "</b> " + T("total") + "</span>");
    bits.push("<span><b>" + items.length + "</b> " + T("shown") + "</span>");
  }
  if (F.has("reminder")) {
    const over = rows.filter(isOverdue).length;
    if (over) bits.push('<span class="bad"><b>' + over + "</b> overdue</span>");
  }
  strip.hidden = !bits.length;
  strip.innerHTML = bits.join("");
}

function render() {

  if (MODEL.report && typeof renderReport === "function") renderReport();
  /* @end only */
  /* @only sequence */

  /* @end only */

  /* @end only */

  const calOn = F.has("calendar") && MODEL.calendar && typeof renderCalendar === "function";
  const dirOn = F.has("directory") && MODEL.directory && typeof renderDirectory === "function";
  const cmpOn = F.has("comparison") && MODEL.comparison && typeof renderComparison === "function";
  const galOn = F.has("gallery") && MODEL.gallery && typeof renderGallery === "function";
  const quizOn = F.has("quiz") && MODEL.quiz && typeof renderQuiz === "function";
  if (galOn || quizOn) {

    const g2 = $("#gal"), q2 = $("#quiz");
    if (g2) g2.className = galOn ? "on" : "";
    if (q2) q2.className = quizOn ? "on" : "";
    if (galOn) renderGallery();
    if (quizOn) renderQuiz();
    renderStrip();
    return;
  }
  const tlOn = F.has("timeline") && MODEL.timeline && typeof renderTimeline === "function";
  if (tlOn) {
    list.hidden = true;
    list.innerHTML = "";
    const tl = $("#timeline");
    if (tl) tl.className = "on";
    renderTimeline();
    renderStrip();
    return;
  }
  if (dirOn || cmpOn) {
    list.hidden = true;
    list.innerHTML = "";
    const d = $("#dir"), c2 = $("#cmp");
    if (d) d.className = dirOn ? "on" : "";
    if (c2) c2.className = cmpOn ? "on" : "";
    if (dirOn) renderDirectory();
    if (cmpOn) renderComparison();
    renderStrip();
    return;
  }
  if (boardOn || calOn) {
    list.hidden = true;
    list.innerHTML = "";
    const b = $("#board"), c = $("#cal");
    if (b) b.className = boardOn ? "on" : "";
    if (c) c.className = calOn ? "on" : "";
    if (boardOn) renderBoard();
    if (calOn) renderCalendar();
    renderStrip();
    return;
  }
  list.hidden = false;
  list.innerHTML = "";
  if (!items.length) {
    list.appendChild(el("li", "empty", rows.length ? "No match." : T("empty")));
  }
  const tickField = F.has("toggle") && MODEL.progress ? MODEL.progress.field : null;
  for (const r of items) {
    const li = el("li", "item");
    if (tickField && (r[tickField] === true || r[tickField] === "true")) li.className = "item done";
    if (tickField) {
      const tick = document.createElement("input");
      tick.type = "checkbox";
      tick.className = "tick";
      tick.checked = r[tickField] === true || r[tickField] === "true";
      tick.setAttribute("aria-label", "mark done");
      tick.onchange = () => {
        r[tickField] = tick.checked;
        r.updated = today();
        save();
        render();
      };
      li.appendChild(tick);
    }
    const body = el("div", "body");
    const title = el("div", "t");
    if (F.has("detail") && typeof openDetail === "function") {
      const link = document.createElement("button");
      link.className = "ghost";
      link.style.padding = "0";
      link.style.border = "0";
      link.style.background = "none";
      link.style.font = "inherit";
      link.style.fontWeight = "600";
      link.style.textAlign = "left";
      link.style.cursor = "pointer";
      link.textContent = String(r[FIELDS[0].name] || "(untitled)");
      link.setAttribute("aria-label", "open " + link.textContent);
      link.onclick = () => openDetail(r);
      title.appendChild(link);
    } else {

      body.appendChild(line);
    }
    for (const f of FIELDS.slice(1)) {
      if (f.type === "bool") continue;

      if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) continue;

      } else if (f.type === "currency_cents") {

      } else if (f.type === "image") {
    input = document.createElement("input");

  } else if (f.type === "lookup") {
        body.appendChild(el("div", "d", (f.label + ": " + (labelOf(f.entity, v) || "—"))));

/* @only crud */
function fieldInput(f, value) {
  let input;
  if (f.type === "longtext") {
    input = document.createElement("textarea");
    input.rows = 4;
  } else if (f.type === "select") {
    input = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "-";
    input.appendChild(blank);
    for (const o of (f.options || [])) {
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      input.appendChild(op);
    }
  } else if (f.type === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
  } else if (f.type === "number") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "any";
  } else if (f.type === "lookup") {
    input = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "—";
    input.appendChild(blank);
    /* @only relation */
    for (const other of DB[f.entity] || []) {
      const o = document.createElement("option");
      o.value = other.id;
      o.textContent = String(other[titleFieldOf(f.entity)] || other.id);
      input.appendChild(o);
    }
    /* @end only */
  } else if (f.type === "duration") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "1";
    input.min = "0";
    input.inputMode = "numeric";
    input.placeholder = "minutes";
  } else if (f.type === "duration") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "1";
    input.min = "0";
    input.inputMode = "numeric";
    input.placeholder = "minutes";
  } else if (f.type === "currency_cents") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "0.01";
    input.inputMode = "decimal";
    input.placeholder = "0.00";
  } else if (f.type === "date") {
    input = document.createElement("input");
    input.type = "date";
  } else if (f.type === "tags") {
    input = document.createElement("input");
    input.type = "text";
    input.placeholder = "comma, separated";
  } else {
    input = document.createElement("input");
    input.type = "text";
  }
  input.id = "f_" + f.name;
  input.name = f.name;
  if (f.type === "bool") input.checked = value === true || value === "true";
  else if (f.type === "duration") input.value = (value === undefined || value === null || value === "") ? "" : value;
  else if (f.type === "currency_cents") input.value = (value === undefined || value === null || value === "") ? "" : moneyPlain(value);
  else if (f.type === "tags") input.value = Array.isArray(value) ? value.join(", ") : (value || "");
  else input.value = value === undefined || value === null ? (f.default !== undefined ? f.default : "") : value;
  return input;
}
/* @only steps */
let stepIndex = 0;
let draft = {};
const STEPS = (MODEL.wizard && MODEL.wizard.steps) || null;

function renderStep() {
  const step = STEPS[stepIndex];
  $("#editorTitle").textContent = step.title ||

  });

function collectStep() {
  const {out, errs} = readForm(STEPS[stepIndex].fields);
  for (const k of Object.keys(out)) draft[k] = out[k];
  return errs;
}

function openEditor(id) {

function readForm(only) {
  const out = {}, errs = [];
  const wanted = only ? FIELDS.filter((f) => only.indexOf(f.name) >= 0) : FIELDS;
  for (const f of wanted) {
    const input = $("#f_" + f.name);
    if (!input) continue;
    let v;
    if (f.type === "bool") v = input.checked;
    else if (f.type === "tags") v = input.value.split(",").map((s) => s.trim()).filter(Boolean);
    else if (f.type === "currency_cents") {
      v = input.value === "" ? null : toCents(input.value);
      if (input.value !== "" && v === null) errs.push(f.label + " must be an amount");
    } else if (f.type === "number") {
      if (input.value === "") v = null;
      else if (isNaN(Number(input.value))) errs.push(f.label + " must be a number");
      else v = Number(input.value);
    } else v = input.value.trim();
    if (f.required && (v === "" || v === null || v === undefined)) errs.push(f.label + " is required");
    if (f.type === "date" && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errs.push(f.label + " must be a date");
    if (f.type === "select" && v && !(f.options || []).includes(v)) errs.push(f.label + " must be one of the listed values");
    out[f.name] = v;
  }
  return {out, errs};
}
/* @end only */

/* ---------- export / import ---------- */
function download(name, text, mime) {
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toCSV() {
  const cols = FIELDS.map((f) => f.name);
  const cell = (v, f) => {
    const s = Array.isArray(v) ? v.join("; ") : (v === undefined || v === null ? "" : String(v));
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(",")].concat(rows.map((r) =>
    cols.map((c) => cell(f.type === "currency_cents" ? moneyPlain(r[c]) : r[c],
                         FIELDS.find((x) => x.name === c))).join(","))).join("\n");
}
function doExport() {
  const stamp = today();
  if (typeof markExport === "function") markExport();
  if (F.has("export")) {
    download(MODEL.id + "-" + stamp + ".json", JSON.stringify({v: MODEL.version, rows: rows}, null, 2), "application/json");
    download(MODEL.id + "-" + stamp + ".csv", toCSV(), "text/csv");
  } else {
    download(MODEL.id + "-" + stamp + ".json", JSON.stringify({v: MODEL.version, rows: rows}, null, 2), "application/json");
  }
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(String(fr.result));
      const incoming = Array.isArray(parsed) ? parsed : parsed.rows;
      if (!Array.isArray(incoming)) throw new Error("no rows");
      const clean = incoming.filter((r) => r && typeof r === "object").map((r) => {
        const copy = Object.assign({}, r);
        if (!copy.id) copy.id = uid();
        return copy;
      });
      rows = clean;
      save(); render();
    } catch (e) {
      banner = {kind: "bad", text: "That file is not a valid backup: " + e.message};
      paintBanners();
    }
  };
  fr.readAsText(file);
}

  });
  $("#cancel").onclick = () => $("#editor").close();
  const stepNext = $("#stepNext"), stepBack = $("#stepBack"), stepSave = $("#stepSave");
  if (stepNext) stepNext.onclick = () => {
    if (typeof collectStep !== "function") return;
    const errs = collectStep();
    if (errs.length) { $("#formErr").textContent = errs.join(" · "); return; }
    if (stepIndex < STEPS.length - 1) { stepIndex += 1; renderStep(); }
  };
  if (stepBack) stepBack.onclick = () => {
    if (typeof collectStep === "function") collectStep();
    if (stepIndex > 0) { stepIndex -= 1; renderStep(); }
  };
  if (stepSave) stepSave.onclick = () => {
    if (typeof collectStep !== "function") return;
    const errs = collectStep();
    if (errs.length) { $("#formErr").textContent = errs.join(" · "); return; }
    commit(Object.assign({}, draft));
  };
  function commit(out) {
    if (editingId) {
      const i = rows.findIndex((x) => x.id === editingId);
      if (i >= 0) rows[i] = Object.assign({}, rows[i], out, {updated: today()});
    } else {
      rows.unshift(Object.assign({id: uid(), created: today(), updated: today()}, out));
    }
    save();
    $("#editor").close();
    bootSort();
    render();
  }
  $("#form").onsubmit = (e) => {
    e.preventDefault();
    if (typeof STEPS !== "undefined" && STEPS) return;   /* the step buttons drive it */
    const {out, errs} = readForm();
    if (errs.length) { $("#formErr").textContent = errs.join(" · "); return; }
    commit(out);
  };
  if (F.has("i18n") && LANGLIST.length > 1) {
    try { const saved = localStorage.getItem(LANG_KEY); if (saved && LANGLIST.indexOf(saved) >= 0) lang = saved; } catch (e) {}
    const sw = document.createElement("button");
    sw.className = "ghost";
    sw.setAttribute("aria-label", "switch language");
    sw.textContent = lang.toUpperCase();
    sw.onclick = () => {
      const i = LANGLIST.indexOf(lang);
      lang = LANGLIST[(i + 1) % LANGLIST.length];
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    };
    document.querySelector("header .row").appendChild(sw);
    applyLang();
  }
  const imp = document.createElement("input");
  imp.type = "file"; imp.accept = ".json,application/json"; imp.hidden = true;
  imp.onchange = () => { if (imp.files && imp.files[0]) doImport(imp.files[0]); };
  document.body.appendChild(imp);
  if (F.has("import")) {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = "Import";
    b.onclick = () => imp.click();
    document.querySelector("header .row").appendChild(b);
  }
  window.addEventListener("online", render);
  window.addEventListener("offline", render);
  bootSort();
  render();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
