      <div class="spacer"></div>
      <button type="submit" class="primary">Save</button>
    </div>
    <p class="hint" style="margin:10px 0 0">Stored on this device only. Nothing leaves it.</p>
  </form>
</dialog>

  const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
  if (rows.length > 0 && (last === 0 || days >= BACKUP_DAYS)) {
    out.push({kind: "", text: last === 0
      ? "You have not exported this list yet. Export writes a file you keep; nothing else backs it up."
      : "Last export was " + days + " days ago. Export writes a file you keep; nothing else backs it up."});
  }
  return out;
}

function paintBanners() {
  const box = $("#banners");
  box.innerHTML = "";
  const list = [];

  }

function visible() {
  let out = rows.slice();
  if (F.has("search") && query) {
    const q = query.toLowerCase();
    out = out.filter((r) => FIELDS.some((f) => {
      const v = r[f.name];
      if (v === undefined || v === null) return false;
      return Array.isArray(v) ? v.join(" ").toLowerCase().includes(q) : String(v).toLowerCase().includes(q);
    }));
  }
  if (F.has("filters") && filterVal) {
    out = out.filter((r) => FIELDS.some((f) =>
      (f.type === "select" && String(r[f.name]) === filterVal) ||
      (f.type === "tags" && Array.isArray(r[f.name]) && r[f.name].includes(filterVal))));
  }
  if (F.has("sort") || true) {
    out.sort((a, b) => {
      const x = a[sortBy], y = b[sortBy];
      if (x === y) return 0;
      if (x === undefined || x === null) return 1;
      if (y === undefined || y === null) return -1;
      return (x > y ? 1 : -1) * sortDir;
    });
  }
  return out;
}
function isOverdue(r) {
  if (!F.has("reminder")) return false;
  const due = r.due;
  if (!due) return false;
  if (r.done === true) return false;
  return String(due) < today();
}
/* @only chart */
function sparkSvg(spark, best) {
  const n = spark.length || 1;
  const w = 300, h = 64, pad = 2;
  const max = Math.max(best, 1);
  const bw = (w - pad * 2) / n;
  const parts = ['<svg class="spark" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="none" role="img" aria-label="Last ' + n + ' days">'];
  parts.push('<line class="axis" x1="0" y1="' + (h - 1) + '" x2="' + w + '" y2="' + (h - 1) + '"/>');
  for (let i = 0; i < n; i++) {
    const v = spark[i].v;
    const bh = Math.max(v > 0 ? 2 : 1, (v / max) * (h - 6));
    const x = pad + i * bw;
    parts.push('<rect class="bar' + (v > 0 ? "" : " empty") + '" x="' + x.toFixed(1) +
      '" y="' + (h - 1 - bh).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) +
      '" height="' + bh.toFixed(1) + '" rx="1.5"><title>' + spark[i].day + ": " + v + "</title></rect>");
  }
  parts.push("</svg>");
  return parts.join("");
}
/* @end only */
/* @only formula */
function renderCalc() {
  const box = $("#calc");
  if (!CALC) return;
  box.hidden = false;
  const inputs = CALC.inputs || [];
  let html = '<div class="grid2">';
  for (const inp of inputs) {
    html += '<label class="f" style="margin:0">' + esc(inp.label || inp.name) +
      (inp.required ? " *" : "") +
      '<input id="ci_' + esc(inp.name) + '" type="number" step="' + esc(inp.step || "any") +
      '" inputmode="decimal" value="' + esc(inp.default === undefined ? "" : inp.default) +
      '"' + (inp.min !== undefined ? ' min="' + esc(inp.min) + '"' : "") +
      (inp.max !== undefined ? ' max="' + esc(inp.max) + '"' : "") + "></label>";
  }
  html += "</div>";
  html += '<div class="result"><div class="k">' + esc(CALC.output.label || "Result") +
    '</div><div class="v" id="calcOut">—</div></div>';
  html += '<div class="err" id="calcErr"></div>';
  if (CALC.note) html += '<p class="hint" style="margin:12px 0 0">' + esc(CALC.note) + "</p>";
  box.innerHTML = html;
  const update = () => {
    const vars = {};
    let bad = null;
    for (const inp of inputs) {
      const elx = $("#ci_" + inp.name);
      const raw = elx.value.trim();
      if (raw === "") {
        if (inp.required) bad = (inp.label || inp.name) + " is required";
        vars[inp.name] = inp.default === undefined ? 0 : Number(inp.default);
        continue;
      }
      const n = Number(raw);
      if (!isFinite(n)) { bad = (inp.label || inp.name) + " must be a number"; vars[inp.name] = 0; continue; }
      if (inp.min !== undefined && n < Number(inp.min)) bad = (inp.label || inp.name) + " is below " + inp.min;
      if (inp.max !== undefined && n > Number(inp.max)) bad = (inp.label || inp.name) + " is above " + inp.max;
      vars[inp.name] = n;
    }
    const outEl = $("#calcOut"), errEl = $("#calcErr");
    if (bad) { outEl.textContent = "—"; errEl.textContent = bad; return; }
    try {
      const v = evalFormula(CALC.formula, vars);
      const dp = Number(CALC.output.decimals);
      const shown = isFinite(dp) ? v.toFixed(Math.max(0, Math.min(6, dp))) : String(v);
      outEl.innerHTML = esc(shown) + (CALC.output.unit
        ? '<span class="u">' + esc(CALC.output.unit) + "</span>" : "");
      errEl.textContent = "";
    } catch (e) {
      outEl.textContent = "—";
      errEl.textContent = e.message;
    }
  };
  for (const inp of inputs) $("#ci_" + inp.name).oninput = update;
  update();
}

function render() {
  paintBanners();
  const list = $("#list");
  const items = visible();
  list.innerHTML = "";
  if (!items.length) {
    list.appendChild(el("li", "empty", rows.length ? "No match." : T("empty")));
  }
  const tickField = F.has("toggle") && MODEL.progress ? MODEL.progress.field : null;
  for (const r of items) {
    const li = el("li", "item");
    if (tickField && (r[tickField] === true || r[tickField] === "true")) li.className = "item done";
    if (tickField) {
      const tick = document.createElement("input");
      tick.type = "checkbox";
      tick.className = "tick";
      tick.checked = r[tickField] === true || r[tickField] === "true";
      tick.setAttribute("aria-label", "mark done");
      tick.onchange = () => {
        r[tickField] = tick.checked;
        r.updated = today();
        save();
        render();
      };
      li.appendChild(tick);
    }
    const body = el("div", "body");
    const title = el("div", "t");
    title.innerHTML = esc(r[FIELDS[0].name] || "(untitled)");
    body.appendChild(title);
    for (const f of FIELDS.slice(1)) {
      if (f.type === "bool") continue;
      const v = r[f.name];
      if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) continue;
      if (f.type === "tags" && Array.isArray(v)) {
        const chips = el("div", "chips");
        v.forEach((t) => chips.appendChild(el("span", "chip", t)));
        body.appendChild(chips);
      } else if (f.type === "currency_cents") {
        body.appendChild(el("div", "d", (f.label + ": " + money(v))));
      } else {
        body.appendChild(el("div", "d", (f.label + ": " + v)));
      }
    }
    if (isOverdue(r)) body.appendChild(el("div", "overdue", "Overdue since " + r.due));
    li.appendChild(body);
    const acts = el("div", "row");
    const edit = el("button", "ghost", T("edit"));
    edit.onclick = () => openEditor(r.id);
    const del = el("button", "ghost", T("del"));
    del.onclick = () => {
      if (!confirm("Delete this " + ENTITY.label.toLowerCase() + "?")) return;
      rows = rows.filter((x) => x.id !== r.id);
      save(); render();
    };
    acts.appendChild(edit); acts.appendChild(del);
    li.appendChild(acts);
    list.appendChild(li);
  }
  if (CALC && F.has("formula")) { return; }
  if (F.has("progress")) renderProgress();
  if (F.has("derived")) renderDerived();
  const strip = $("#strip");
  if (F.has("stats")) {
    strip.hidden = false;
    const over = rows.filter(isOverdue).length;
    strip.innerHTML = "<span><b>" + rows.length + "</b> " + T("total") + "</span>" +
      "<span><b>" + items.length + "</b> " + T("shown") + "</span>" +
      (F.has("reminder") ? "<span><b>" + over + "</b> overdue</span>" : "");
  } else {
    strip.hidden = true;
  }
}

/* ---------- form ---------- */
function fieldInput(f, value) {
  let input;
  if (f.type === "longtext") {
    input = document.createElement("textarea");
    input.rows = 4;
  } else if (f.type === "select") {
    input = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "-";
    input.appendChild(blank);
    for (const o of (f.options || [])) {
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      input.appendChild(op);
    }
  } else if (f.type === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
  } else if (f.type === "number") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "any";
  } else if (f.type === "currency_cents") {
    input = document.createElement("input");
    input.type = "number";
    input.step = "0.01";
    input.inputMode = "decimal";
    input.placeholder = "0.00";
  } else if (f.type === "date") {
    input = document.createElement("input");
    input.type = "date";
  } else if (f.type === "tags") {
    input = document.createElement("input");
    input.type = "text";
    input.placeholder = "comma, separated";
  } else {
    input = document.createElement("input");
    input.type = "text";
  }
  input.id = "f_" + f.name;
  input.name = f.name;
  if (f.type === "bool") input.checked = value === true || value === "true";
  else if (f.type === "currency_cents") input.value = (value === undefined || value === null || value === "") ? "" : moneyPlain(value);
  else if (f.type === "tags") input.value = Array.isArray(value) ? value.join(", ") : (value || "");
  else input.value = value === undefined || value === null ? (f.default !== undefined ? f.default : "") : value;
  return input;
}
function openEditor(id) {
  editingId = id || null;
  const r = id ? rows.find((x) => x.id === id) : null;
  $("#editorTitle").textContent = (r ? "Edit " : "New ") + ENTITY.label;
  const box = $("#fields");
  box.innerHTML = "";
  $("#formErr").textContent = "";
  for (const f of FIELDS) {
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.required ? " *" : "");
    lab.appendChild(fieldInput(f, r ? r[f.name] : undefined));
    box.appendChild(lab);
  }
  $("#editor").showModal();
  const first = box.querySelector("input,textarea,select");
  if (first) first.focus();
}
function readForm() {
  const out = {}, errs = [];
  for (const f of FIELDS) {
    const input = $("#f_" + f.name);
    let v;
    if (f.type === "bool") v = input.checked;
    else if (f.type === "tags") v = input.value.split(",").map((s) => s.trim()).filter(Boolean);
    else if (f.type === "number") {
      if (input.value === "") v = null;
      else if (isNaN(Number(input.value))) errs.push(f.label + " must be a number");
      else v = Number(input.value);
    } else if (f.type === "currency_cents") {
      if (input.value === "") v = null;
      else {
        v = toCents(input.value);
        if (v === null) errs.push(f.label + " must be an amount");
      }
    } else v = input.value.trim();
    if (f.required && (v === "" || v === null || v === undefined)) errs.push(f.label + " is required");
    if (f.type === "date" && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errs.push(f.label + " must be a date");
    if (f.type === "select" && v && !(f.options || []).includes(v)) errs.push(f.label + " must be one of the listed values");
    out[f.name] = v;
  }
  return {out, errs};
}

/* ---------- export / import ---------- */
function download(name, text, mime) {
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toCSV() {
  const cols = FIELDS.map((f) => f.name);
  const cell = (v, f) => {
    const s = Array.isArray(v) ? v.join("; ") : (v === undefined || v === null ? "" : String(v));
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(",")].concat(rows.map((r) =>
    cols.map((c) => cell(f.type === "currency_cents" ? moneyPlain(r[c]) : r[c],
                         FIELDS.find((x) => x.name === c))).join(","))).join("\n");
}
function doExport() {
  const stamp = today();
  if (typeof markExport === "function") markExport();
  if (F.has("export")) {
    download(MODEL.id + "-" + stamp + ".json", JSON.stringify({v: MODEL.version, rows: rows}, null, 2), "application/json");
    download(MODEL.id + "-" + stamp + ".csv", toCSV(), "text/csv");
  } else {
    download(MODEL.id + "-" + stamp + ".json", JSON.stringify({v: MODEL.version, rows: rows}, null, 2), "application/json");
  }
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(String(fr.result));
      const incoming = Array.isArray(parsed) ? parsed : parsed.rows;
      if (!Array.isArray(incoming)) throw new Error("no rows");
      const clean = incoming.filter((r) => r && typeof r === "object").map((r) => {
        const copy = Object.assign({}, r);
        if (!copy.id) copy.id = uid();
        return copy;
      });
      rows = clean;
      save(); render();
    } catch (e) {
      banner = {kind: "bad", text: "That file is not a valid backup: " + e.message};
      paintBanners();
    }
  };
  fr.readAsText(file);
}

function bootPWA() {

    start_url: ".", display: "standalone",

function bootSort() {
  const sel = $("#sort");
  sel.innerHTML = "";
  for (const f of FIELDS) {
    const o = document.createElement("option");
    o.value = f.name; o.textContent = T("sortBy") + f.label;
    sel.appendChild(o);
  }
  sel.value = FIELDS[0].name;
  sortBy = FIELDS[0].name;
  sel.onchange = () => { sortBy = sel.value; sortDir = -1; render(); };

  const filterFields = FIELDS.filter((f) => f.type === "select" || f.type === "tags");

      const vals = f.type === "select"
        ? (f.options || [])
        : rows.flatMap((r) => Array.isArray(r[f.name]) ? r[f.name] : []);
      for (const v of vals) {
        if (seen.has(v)) continue;
        seen.add(v);
        const o = document.createElement("option");

  bootTheme();

  bootAbout();
  if (CALC && F.has("formula")) {
    for (const id of ["add", "export", "search", "sort", "print", "filter"]) {
      const elx = document.getElementById(id);
      if (elx) elx.hidden = true;
    }
    const list = $("#list");
    if (list) list.hidden = true;
    const strip0 = $("#strip");
    if (strip0) strip0.hidden = true;
    renderCalc();
    return;
  }
  if (tampered()) {
    banner = {kind: "bad", text: "This file was modified after it was built. " +
      "The licence and attribution shown under About describe the build, not this copy."};
  }
  if (BUILD.tier === "demo") {
    banner = {kind: "warn", text: "Demo build. Features are capped and export is disabled. " +
      "Build the full app with KILN locally — it takes one command and needs no network."};
  }
  rows = load();
  if (!rows.length && F.has("crud")) {
    /* no seeding: an empty app is a correct app */
  }
  /* a feature that is not in the model must not leave a button behind */
  if (!F.has("crud")) { $("#add").hidden = true; $("#list").hidden = true; }
  if (!F.has("export")) { $("#export").hidden = true; }
  if (!F.has("print")) { $("#print").hidden = true; }
  if (!F.has("sort")) { $("#sort").hidden = true; }
  $("#add").onclick = () => openEditor(null);
  $("#export").onclick = doExport;
  $("#theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  };
  $("#print").onclick = () => window.print();
  const s = $("#search");
  if (!F.has("search")) s.hidden = true;
  s.oninput = () => { query = s.value; render(); };
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); s.focus(); }
    if (e.key === "Escape" && $("#editor").open) $("#editor").close();
  });
  $("#cancel").onclick = () => $("#editor").close();
  $("#form").onsubmit = (e) => {
    e.preventDefault();
    const {out, errs} = readForm();
    if (errs.length) { $("#formErr").textContent = errs.join(" · "); return; }
    if (editingId) {
      const i = rows.findIndex((x) => x.id === editingId);
      if (i >= 0) rows[i] = Object.assign({}, rows[i], out, {updated: today()});
    } else {
      rows.unshift(Object.assign({id: uid(), created: today(), updated: today()}, out));
    }
    save();
    $("#editor").close();
    bootSort();
    render();
  };
  if (F.has("i18n") && LANGLIST.length > 1) {
    try { const saved = localStorage.getItem(LANG_KEY); if (saved && LANGLIST.indexOf(saved) >= 0) lang = saved; } catch (e) {}
    const sw = document.createElement("button");
    sw.className = "ghost";
    sw.setAttribute("aria-label", "switch language");
    sw.textContent = lang.toUpperCase();
    sw.onclick = () => {
      const i = LANGLIST.indexOf(lang);
      lang = LANGLIST[(i + 1) % LANGLIST.length];
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    };
    document.querySelector("header .row").appendChild(sw);
    applyLang();
  }
  const imp = document.createElement("input");
  imp.type = "file"; imp.accept = ".json,application/json"; imp.hidden = true;
  imp.onchange = () => { if (imp.files && imp.files[0]) doImport(imp.files[0]); };
  document.body.appendChild(imp);
  if (F.has("import")) {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = "Import";
    b.onclick = () => imp.click();
    document.querySelector("header .row").appendChild(b);
  }
  window.addEventListener("online", render);
  window.addEventListener("offline", render);
  bootSort();
  render();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
