name: kiln

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py ${{ matrix.python }})
    # 22.04, not ubuntu-latest: the latest image no longer carries Python 3.9,
    # and the point of the matrix is the floor, not the ceiling.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: One-command pipeline
        run: python3 -m kiln pipeline "a tea log with tags and search" -o /tmp/pipe --zip
      - name: Adopt a sloppy model reply
        run: python3 -m kiln adopt tests/fixtures/reply-sloppy.md --out /tmp/adopted --build

  verify-all:
    name: build and verify every spec
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify
        run: python3 -m kiln verify --all
      - name: Build the demo apps
        run: python3 -m kiln build --all -o dist
      - name: Generated pages must match their sources
        run: |
          python3 -m kiln studio
          python3 -m kiln demo
          git diff --exit-code studio.html demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-apps
          path: dist/**

  audit:
    name: forge-defect guards
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Heartbeat
        run: python3 -m kiln heartbeat
      - name: Audit
        run: python3 -m kiln audit --write && git diff --exit-code INDEX.md

  report:
    name: status page
    runs-on: ubuntu-latest
    needs: test
    steps:
      # fetch-depth 0: the page states the commit count, and a shallow clone would
      # report 1 and fail the comparison against the committed page
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # the page is generated from the tree, so a diff means the committed copy is
      # older than the code it describes
      - name: Regenerate and compare
        run: |
          python3 -m kiln report --write
          git diff --exit-code docs/status.html
      - name: The gates it reports on
        run: python3 -m kiln report
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-status
          path: docs/status.html

  lint:
    name: shellcheck and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          if compgen -G "**/*.sh" > /dev/null; then shellcheck $(find . -name '*.sh'); fi
      - name: Python compiles
        run: python3 -m compileall -q kiln tests
